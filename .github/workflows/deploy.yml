name: deploy
# push to dev  -> deploys the dev environment
# push to main -> deploys the prod environment
on:
  push:
    branches: [dev, main]

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TF_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        working-directory: infrastructure
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=profitx/${TF_ENV}.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
      - name: Plan
        working-directory: infrastructure
        run: terraform plan -var-file=envs/${TF_ENV}.tfvars -out=tfplan
      - name: Apply
        working-directory: infrastructure
        run: terraform apply -auto-approve tfplan
