<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProfitX Scanner</title>
<style>
  :root {
    --ground: #eef1f4;
    --panel: #ffffff;
    --ink: #14202e;
    --muted: #5d6b7a;
    --line: #d3dae2;
    --gain: #0a7a4b;
    --gain-bar: #bfe6d1;
    --danger: #b3261e;
    --focus: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1720;
      --panel: #16212d;
      --ink: #e6edf4;
      --muted: #93a3b4;
      --line: #263444;
      --gain: #4cd08f;
      --gain-bar: #1d4a38;
      --danger: #ff8a80;
      --focus: #7fb0ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 10px; margin-bottom: 14px; font: inherit; color: var(--ink);
    background: var(--ground); border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--ink); background: var(--ink); color: var(--panel);
  }
  button.quiet { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
  button:disabled { opacity: 0.55; cursor: wait; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #login { max-width: 360px; margin: 12vh auto 0; }
  .error { color: var(--danger); min-height: 1.4em; margin: 10px 0 0; font-size: 0.9rem; }
  .summary { color: var(--muted); margin: 0 0 14px; font-size: 0.9rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; font-size: 0.85rem; color: var(--muted); }
  td.sym { font-weight: 700; }
  td.gap { position: relative; color: var(--gain); font-weight: 700; min-width: 120px; }
  td.gap .fill { position: absolute; inset: 6px 0 6px auto; background: var(--gain-bar); border-radius: 3px; z-index: 0; }
  td.gap span { position: relative; z-index: 1; }
  .empty { padding: 28px 0; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login" class="panel" hidden>
    <h1>ProfitX Scanner</h1>
    <p class="summary">Sign in to see today's gappers.</p>
    <label for="user">Username</label>
    <input id="user" autocomplete="username">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <p id="loginError" class="error" role="alert"></p>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <h1>ProfitX Scanner</h1>
      <div>
        <button id="runBtn">Run scan</button>
        <button id="logoutBtn" class="quiet">Sign out</button>
      </div>
    </div>
    <div class="panel">
      <p id="summary" class="summary"></p>
      <p id="appError" class="error" role="alert"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Symbol</th><th>Price</th><th>Gap %</th><th>Volume</th><th>RVOL</th><th>Float</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No scan yet. Select Run scan.</p>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>
const { region, clientId, apiUrl } = window.CONFIG;
let idToken = null; // kept in memory only, so a refresh signs you out

const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString();

async function signIn(username, password) {
  const res = await fetch(`https://cognito-idp.${region}.amazonaws.com/`, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-amz-json-1.1",
      "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
    },
    body: JSON.stringify({
      AuthFlow: "USER_PASSWORD_AUTH",
      ClientId: clientId,
      AuthParameters: { USERNAME: username, PASSWORD: password },
    }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || "Sign-in failed");
  if (!data.AuthenticationResult) throw new Error("This account needs a permanent password. Ask the admin to reset it.");
  idToken = data.AuthenticationResult.IdToken;
}

async function api(method, path, body) {
  const res = await fetch(apiUrl + path, {
    method,
    headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showLogin("Session expired. Sign in again."); throw new Error("expired"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function render({ scan, results }) {
  const rows = $("rows");
  rows.replaceChildren();
  $("empty").hidden = !!scan;
  $("summary").textContent = scan
    ? `${scan.matched} of ${scan.scanned} symbols matched · ${new Date(scan.created_at).toLocaleString()}`
    : "";
  const maxGap = Math.max(1, ...results.map((r) => r.gap_pct));
  for (const r of results) {
    const tr = document.createElement("tr");
    const cells = [
      ["sym", r.symbol], ["", `$${Number(r.price).toFixed(2)}`], ["gap", null],
      ["", fmt(r.volume)], ["", `${Number(r.rvol).toFixed(2)}x`], ["", fmt(r.float)],
    ];
    for (const [cls, text] of cells) {
      const td = document.createElement("td");
      if (cls) td.className = cls;
      if (cls === "gap") {
        const fill = document.createElement("div");
        fill.className = "fill";
        fill.style.width = `${(r.gap_pct / maxGap) * 100}%`;
        const label = document.createElement("span");
        label.textContent = `+${Number(r.gap_pct).toFixed(2)}%`;
        td.append(fill, label);
      } else {
        td.textContent = text;
      }
      tr.append(td);
    }
    rows.append(tr);
  }
}

function showLogin(message = "") {
  idToken = null;
  $("app").hidden = true;
  $("login").hidden = false;
  $("loginError").textContent = message;
}

async function showApp() {
  $("login").hidden = true;
  $("app").hidden = false;
  try { render(await api("GET", "/scans/latest")); }
  catch (e) { if (e.message !== "expired") $("appError").textContent = e.message; }
}

$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true;
  $("loginError").textContent = "";
  try { await signIn($("user").value.trim(), $("pass").value); $("pass").value = ""; await showApp(); }
  catch (e) { $("loginError").textContent = e.message; }
  finally { $("loginBtn").disabled = false; }
};

$("runBtn").onclick = async () => {
  $("runBtn").disabled = true;
  $("runBtn").textContent = "Scanning…";
  $("appError").textContent = "";
  try { render(await api("POST", "/scans", {})); }
  catch (e) { if (e.message !== "expired") $("appError").textContent = e.message; }
  finally { $("runBtn").disabled = false; $("runBtn").textContent = "Run scan"; }
};

$("logoutBtn").onclick = () => showLogin();
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
showLogin();
</script>
</body>
</html>
